[package]
name = "netspeed-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "netspeed"
path = "src/main.rs"

[dependencies]
netspeed-core = { path = "../core" }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Com",
    "Win32_UI_Controls_Dialogs",
    "Win32_Networking_WinHttp",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
# PaddleOCR 推理（Apache-2.0，纯 Rust，无 ONNX Runtime）；上游锁 nightly-2026-09-08
simd-paddle-ocr-rs = { git = "https://github.com/mg-chao/simd-paddle-ocr-rs.git", rev = "43aba513b661e48eacb04d19f1ff071649116ddf" }

libwebp-sys = "0.14"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
]
