name: Release

# 打 tag（v1.2.3）时出 Windows 包：exe + models/（取字模型）+ README + LICENSE，打成 zip 挂到 Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml 钉了 nightly-2026-09-08（OCR 依赖要 portable_simd）
      - name: Install toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p netspeed-app

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $dir = "netspeed-$tag"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item target/release/netspeed.exe $dir
          Copy-Item README.md, LICENSE $dir

          # 取字（OCR）要用 models/det.onnx 等，仓库里已经带了，必须一起打包，
          # 否则解压出来点「取字」只会提示找不到 models 目录
          if (-not (Test-Path models)) {
            throw "models/ 不存在，打出来的包取字功能不可用"
          }
          Copy-Item -Recurse models $dir

          # 把这次构建的身份写进包里，省得看 exe 时间戳猜是不是最新：
          # exe 的时间就是「构建完成时间」，一定比 checkout 出来的源码新
          $exe = Get-Item target/release/netspeed.exe
          $info = @(
            "tag         : $tag"
            "commit      : ${{ github.sha }}"
            "built at    : $($exe.LastWriteTime.ToString('yyyy-MM-dd HH:mm:ss'))"
            "exe size    : $($exe.Length) bytes"
            "exe md5     : $((Get-FileHash $exe -Algorithm MD5).Hash)"
            "rustc       : $((rustc --version))"
          )
          $info | Set-Content -Path (Join-Path $dir "build-info.txt") -Encoding UTF8

          Compress-Archive -Path $dir -DestinationPath "netspeed-$tag-win64.zip" -Force
          Get-ChildItem "netspeed-$tag-win64.zip" | Select-Object Name, Length

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          # zip 给手动下载；单独的 netspeed.exe 给程序内「检查更新」直接下载用
          files: |
            netspeed-*.zip
            target/release/netspeed.exe
          # 仓库还没填 license 文件时也能出包；说明里带上提交范围
          generate_release_notes: true

      # Releases 只留最近 5 个，旧的连 tag 一起删掉，免得列表越滚越长
      - name: Prune old releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "token $env:GH_TOKEN"
            "User-Agent"  = "netspeed-release"
            Accept        = "application/vnd.github+json"
          }
          $base = "https://api.github.com/repos/${{ github.repository }}"
          $releases = Invoke-RestMethod -Uri "$base/releases?per_page=100" -Headers $headers
          $keep = $releases | Select-Object -First 5
          $drop = $releases | Where-Object { $keep.id -notcontains $_.id }
          foreach ($release in $drop) {
            Write-Host "删除旧 Release $($release.tag_name)"
            Invoke-RestMethod -Method Delete -Uri "$base/releases/$($release.id)" -Headers $headers | Out-Null
            # Release 删了 tag 还在，一起清掉
            try {
              Invoke-RestMethod -Method Delete -Uri "$base/git/refs/tags/$($release.tag_name)" -Headers $headers | Out-Null
            } catch {
              Write-Host "tag $($release.tag_name) 删除失败（可能已不存在）"
            }
          }
